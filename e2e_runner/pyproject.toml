[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "e2e-runner"
version = "1.0.0"
description = "CLI runner for automated E2E testing of web applications"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "playwright>=1.40",
    "pyyaml>=6.0",
    "textual>=0.47",
]

[project.scripts]
e2e = "e2e_runner.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real-browser tests against demo_app (skipped unless it runs on :8080)"]
