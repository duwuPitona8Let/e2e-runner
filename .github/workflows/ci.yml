name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Lint & unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: e2e_runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: e2e_runner/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]" ruff

      - name: Lint
        run: ruff check .

      # Unit tests use a fake Playwright, so no browser is installed here.
      - name: Unit tests
        run: |
          set -o pipefail
          python -m pytest -m "not integration" --cov=e2e_runner --cov-report=term | tee pytest.txt
          {
            echo "### Coverage (Python ${{ matrix.python }})"
            echo '```'
            sed -n '/coverage:/,/^TOTAL/p' pytest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: E2E on demo_app
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e_runner/pyproject.toml

      - name: Install e2e_runner, Flask and Chromium
        run: |
          pip install -e "e2e_runner[dev]" flask
          python -m playwright install --with-deps chromium

      - name: Start demo_app
        working-directory: demo_app
        run: |
          python app.py > "$RUNNER_TEMP/demo_app.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080 > /dev/null && exit 0
            sleep 1
          done
          echo "demo_app did not start"; cat "$RUNNER_TEMP/demo_app.log"; exit 1

      - name: Integration tests (pytest)
        working-directory: e2e_runner
        run: python -m pytest -m integration -v

      # demo_app/tests has 3 intentionally failing tests, so `e2e run` must exit 1
      # with exactly 23 passed / 3 failed. Anything else (crash, exit 0, other counts) fails CI.
      - name: Run e2e CLI (expects 3 intentional failures)
        run: |
          set +e
          e2e run demo_app/tests -u http://localhost:8080 -n 4 --trace \
            --html e2e-report.html --json e2e-report.json
          code=$?
          set -e
          python .github/scripts/check_e2e_report.py e2e-report.json "$code" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e-report.html
            e2e-report.json
            ~/.e2e_runner/screenshots/
            ~/.e2e_runner/traces/
          if-no-files-found: ignore
